name: Release

on:
  workflow_dispatch:
  push:
    # release on tag push
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build_docs:
    name: Build docs
    uses: ./.github/workflows/sphinx.yml

  create_release:
    name: Create Release
    needs: [build_wheels, build_docs]
    runs-on: ubuntu-22.04

    steps:
      - name: Get version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          echo ${{ env.VERSION }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # download all artifacts to project dir
      - uses: actions/download-artifact@v8

      - name: check artifacts
        run: |
          ls -l packages/

      - name: Generate changes file
        uses: sarnold/gitchangelog-action@6bc7b8dab7457627adb8aceab87d8f70c85f6e0f  # v1.1.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body_path: CHANGES.md
          draft: false
          prerelease: false
          files: |
            packages/*.whl
            packages/*.tar.gz
